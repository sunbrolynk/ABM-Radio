name: Bug report
description: Something in the catalog or the scripts is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and the track or file it ran on. Leave out keys, hostnames and paths on your own machine.
  - type: textarea
    id: output
    attributes:
      label: Output or log
      description: Strip keys, hostnames and paths on your own machine before pasting.
      render: text
