[project]
name = "abm-radio"
version = "0.1.0"
requires-python = ">=3.12"

# The [project] table only carries the release version; the scripts are plain files run with python3, not a package.
[tool.ruff]
target-version = "py312"
# The scripts import each other and the tests import both, so all of them sort as first-party.
src = ["scripts", "tests"]
# Only the import sorter reads this (it wraps a longer import); E501 is off.
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't widen or narrow the gate.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
